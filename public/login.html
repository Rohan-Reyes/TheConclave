<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Conclave</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11151c;color:#eef1f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#242c40,transparent 65%)}main{width:100%;max-width:390px;padding:32px;border:1px solid #384154;background:#1a202b;border-radius:20px;box-shadow:0 24px 80px #0005}.mark{display:flex;gap:7px;margin-bottom:25px}.mark i{width:15px;height:15px;border-radius:50%;background:#d97757}.mark i:nth-child(2){background:#4285f4}.mark i:nth-child(3){background:#10a37f}h1{font-size:28px;letter-spacing:-.6px;margin:0 0 8px}p{color:#b6c0d2;line-height:1.5;margin:0 0 24px}label{display:block;font-size:14px;margin-bottom:7px}input,button{width:100%;font:inherit;font-size:16px;border-radius:10px;min-height:46px;padding:11px 13px}input{color:inherit;background:#111722;border:1px solid #455169;margin-bottom:18px}input:focus{outline:2px solid #82aaff;outline-offset:2px}button{border:0;background:#a9c6ff;color:#102244;font-weight:650;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#error{color:#ffb8ad;line-height:1.5;min-height:22px;margin-top:16px;font-size:14px}.foot{font-size:12px;color:#8491a8;margin:20px 0 0}a{color:#a9c6ff}
</style></head><body><main><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>Welcome to Conclave</h1><p>Sign in to your private workspace.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="200" autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit" type="submit">Sign in</button><div id="error" role="alert" aria-live="polite"></div></form><p class="foot">Private access · One owner account</p></main>
<script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign in');location.replace('/');}catch(e){error.textContent=e.message;}finally{b.disabled=false;}});
</script></body></html>
